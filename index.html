<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Espuma 3D</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  height: 100%;
  background: #fff;
  overflow: hidden;
  font-family: system-ui, sans-serif;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

#ui {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-start;
  color: #222;
  font-size: 14px;
  z-index: 10;
  pointer-events: none;
}

#ui > * {
  pointer-events: auto;
}

.acciones {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

#ui button,
#ui label.btn-archivo {
  font: inherit;
  padding: 9px 14px;
  border: 1px solid #222;
  background: rgba(255, 255, 255, 0.92);
  color: #222;
  cursor: pointer;
  border-radius: 6px;
  touch-action: manipulation;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

#ui button:hover,
#ui label.btn-archivo:hover {
  background: #eee;
}

#ui input[type="file"] {
  display: none;
}

.herramientas {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

/* Lista vertical de colores */
.paleta {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 6px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid #222;
  border-radius: 6px;
}

.swatch {
  width: 28px;
  height: 28px;
  border: 1px solid #444;
  border-radius: 5px;
  cursor: pointer;
  padding: 0;
  flex-shrink: 0;
  touch-action: manipulation;
}

.swatch.activo {
  outline: 2px solid #000;
  outline-offset: 2px;
  transform: scale(1.06);
}

.swatch.metal {
  background: linear-gradient(135deg, #ffffff 0%, #9fa6b2 45%, #e5e7eb 65%, #525866 100%);
}

canvas {
  touch-action: none;
  display: block;
}

@media (max-width: 600px) {
  #ui {
    top: 10px;
    bottom: 12px;
    left: 10px;
    right: 10px;
    justify-content: space-between;
  }

  .herramientas {
    order: 1;
  }

  .acciones {
    order: 2;
    width: 100%;
  }

  .acciones button,
  .acciones label.btn-archivo {
    flex: 1 1 46%;
    padding: 10px 8px;
    font-size: 13px;
  }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="ui">
  <div class="acciones">
    <button id="btnModo" type="button">Dibujar</button>
    <label class="btn-archivo" for="archivoFondo">Importar fondo</label>
    <button id="btnFondoBlanco" type="button" style="display: none;">Quitar fondo</button>
    <button id="btnGuardar" type="button">Guardar creación</button>
    <button id="btnBorrar" type="button">Borrar todo</button>
  </div>

  <input id="archivoFondo" type="file" accept="image/*">

  <div class="herramientas">
    <div class="paleta" id="paleta"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// 1. ESCENA
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(
  50, innerWidth / innerHeight, 0.1, 100
);
camera.position.set(0, 0, 4);

// 2. RENDERER
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  preserveDrawingBuffer: true
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const canvas = renderer.domElement;
canvas.style.touchAction = 'none';

// Entorno sintético para reflejos del color metalizado
function crearEntornoReflejo() {
  const c = document.createElement('canvas');
  c.width = 256;
  c.height = 128;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, c.height);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.5, '#b8c0cc');
  grad.addColorStop(1, '#5a606a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, c.width, c.height);

  ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.beginPath();
  ctx.ellipse(70, 35, 36, 14, -0.2, 0, Math.PI * 2);
  ctx.fill();

  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;

  const pmrem = new THREE.PMREMGenerator(renderer);
  const rt = pmrem.fromEquirectangular(tex);
  tex.dispose();
  pmrem.dispose();
  return rt.texture;
}

scene.environment = crearEntornoReflejo();
scene.environmentIntensity = 0.7;

// 3. ILUMINACIÓN
scene.add(
  new THREE.HemisphereLight(0xffffff, 0x999999, 1.0)
);

const sol = new THREE.DirectionalLight(0xffffff, 2.2);
sol.position.set(3, 5, 4);
scene.add(sol);

// 4. CONTROLES
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enableRotate = true;
controls.enableZoom = true;
controls.enablePan = false;
controls.minDistance = 1.5;
controls.maxDistance = 15;
controls.rotateSpeed = 0.8;
controls.zoomSpeed = 0.8;
controls.touches.ONE = THREE.TOUCH.ROTATE;
controls.touches.TWO = THREE.TOUCH.DOLLY_PAN;
controls.enabled = false;

// 5. PALETA VERTICAL + METALIZADO
const COLORES = [
  { nombre: 'Crema', hex: null, metal: false },
  { nombre: 'Negro', hex: '#222222', metal: false },
  { nombre: 'Rojo', hex: '#e63946', metal: false },
  { nombre: 'Naranja', hex: '#f77f00', metal: false },
  { nombre: 'Amarillo', hex: '#fcbf49', metal: false },
  { nombre: 'Verde', hex: '#2a9d8f', metal: false },
  { nombre: 'Azul', hex: '#277da1', metal: false },
  { nombre: 'Violeta', hex: '#7b2cbf', metal: false },
  { nombre: 'Rosa', hex: '#ff70a6', metal: false },
  { nombre: 'Metalizado', hex: '#d8dee9', metal: true }
];

let colorActual = COLORES[0];
const paletaEl = document.getElementById('paleta');

COLORES.forEach((c, idx) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'swatch' + (c.metal ? ' metal' : '') + (idx === 0 ? ' activo' : '');
  btn.title = c.nombre;
  if (!c.metal) {
    btn.style.backgroundColor = c.hex || '#f5f2e8';
  }

  btn.addEventListener('click', () => {
    colorActual = c;
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('activo'));
    btn.classList.add('activo');
  });
  paletaEl.appendChild(btn);
});

// 6. ESPUMA 3D
const MAX = 30000;
const geoEsfera = new THREE.SphereGeometry(1, 12, 12);

const espumaMate = new THREE.InstancedMesh(
  geoEsfera,
  new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.9
  }),
  MAX
);
espumaMate.count = 0;
scene.add(espumaMate);

const espumaMetal = new THREE.InstancedMesh(
  geoEsfera,
  new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.22,
    metalness: 0.88
  }),
  MAX
);
espumaMetal.count = 0;
scene.add(espumaMetal);

const m = new THREE.Matrix4();
const color = new THREE.Color();

// 7. AGREGAR ESFERITAS
function agregarBola(pos) {
  const mesh = colorActual.metal ? espumaMetal : espumaMate;
  if (mesh.count >= MAX) return;

  const radio = 0.05 + Math.random() * 0.06;

  m.makeScale(radio, radio, radio);
  m.setPosition(
    pos.x + (Math.random() - 0.5) * 0.04,
    pos.y + (Math.random() - 0.5) * 0.04,
    pos.z + (Math.random() - 0.5) * 0.04
  );

  mesh.setMatrixAt(mesh.count, m);

  if (colorActual.hex === null) {
    const t = 0.88 + Math.random() * 0.12;
    color.setRGB(t, t * 0.98, t * 0.92);
  } else {
    color.set(colorActual.hex);
    color.offsetHSL(0, 0, (Math.random() - 0.5) * 0.05);
  }

  mesh.setColorAt(mesh.count, color);

  mesh.count++;
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
}

// 8. SISTEMA DE DIBUJO
let dibujando = true;
let trazoActivo = false;
let profundidad = 0;
let ultimo = null;

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const plano = new THREE.Plane();
const punto = new THREE.Vector3();

// 9. POSICIÓN DEL DEDO O MOUSE
function puntoBajoMouse(e) {
  const rect = canvas.getBoundingClientRect();

  mouse.set(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );

  raycaster.setFromCamera(mouse, camera);

  const dir = camera.getWorldDirection(
    new THREE.Vector3()
  );

  const centro = controls.target.clone()
    .addScaledVector(dir, profundidad);

  plano.setFromNormalAndCoplanarPoint(
    dir.clone().negate(),
    centro
  );

  const resultado = raycaster.ray.intersectPlane(
    plano, punto
  );

  return resultado ? punto.clone() : null;
}

// 10. TRAZOS CONTINUOS
function dibujarHasta(p) {
  if (!ultimo) {
    agregarBola(p);
    ultimo = p;
    return;
  }

  const dist = ultimo.distanceTo(p);
  const pasos = Math.max(1, Math.ceil(dist / 0.04));

  for (let i = 1; i <= pasos; i++) {
    const interpolado = new THREE.Vector3()
      .lerpVectors(ultimo, p, i / pasos);

    agregarBola(interpolado);
  }

  ultimo = p;
}

// 11. DIBUJO CON MOUSE
canvas.addEventListener('pointerdown', (e) => {
  if (!dibujando || e.pointerType === 'touch') return;

  e.preventDefault();
  trazoActivo = true;
  ultimo = null;

  try {
    canvas.setPointerCapture(e.pointerId);
  } catch (error) {}

  const p = puntoBajoMouse(e);
  if (p) dibujarHasta(p);
}, { passive: false });

canvas.addEventListener('pointermove', (e) => {
  if (!dibujando || !trazoActivo || e.pointerType === 'touch') return;

  e.preventDefault();

  const p = puntoBajoMouse(e);
  if (p) dibujarHasta(p);
}, { passive: false });

function finalizarTrazo() {
  trazoActivo = false;
  ultimo = null;
}

canvas.addEventListener('pointerup', finalizarTrazo);
canvas.addEventListener('pointercancel', finalizarTrazo);
canvas.addEventListener('lostpointercapture', finalizarTrazo);

// 12. DIBUJO TÁCTIL DEDICADO
let dedoDibujoId = null;

function posicionDesdeTouch(touch) {
  return {
    clientX: touch.clientX,
    clientY: touch.clientY
  };
}

canvas.addEventListener('touchstart', (e) => {
  if (!dibujando || e.touches.length !== 1) return;

  e.preventDefault();

  const touch = e.changedTouches[0];
  dedoDibujoId = touch.identifier;

  trazoActivo = true;
  ultimo = null;

  const p = puntoBajoMouse(posicionDesdeTouch(touch));
  if (p) dibujarHasta(p);
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  if (!dibujando || dedoDibujoId === null) return;

  e.preventDefault();

  for (const touch of e.changedTouches) {
    if (touch.identifier !== dedoDibujoId) continue;

    const p = puntoBajoMouse(posicionDesdeTouch(touch));
    if (p) dibujarHasta(p);
    break;
  }
}, { passive: false });

function finalizarTouchDibujo(e) {
  if (dedoDibujoId === null) return;

  for (const touch of e.changedTouches) {
    if (touch.identifier === dedoDibujoId) {
      dedoDibujoId = null;
      finalizarTrazo();
      break;
    }
  }
}

canvas.addEventListener('touchend', finalizarTouchDibujo, {
  passive: false
});

canvas.addEventListener('touchcancel', finalizarTouchDibujo, {
  passive: false
});

// 13. PROFUNDIDAD CON RUEDA DEL MOUSE
canvas.addEventListener('wheel', (e) => {
  if (!dibujando) return;

  e.preventDefault();
  e.stopImmediatePropagation();

  profundidad = THREE.MathUtils.clamp(
    profundidad + e.deltaY * 0.002, -3, 3
  );
}, { passive: false, capture: true });

// 14. CAMBIAR MODO
const btnModo = document.getElementById('btnModo');

function cambiarModo() {
  dibujando = !dibujando;
  controls.enabled = !dibujando;
  trazoActivo = false;
  dedoDibujoId = null;
  ultimo = null;
  btnModo.textContent = dibujando ? 'Dibujar' : 'Mover';
}

// 15. BORRAR
function borrarTodo() {
  espumaMate.count = 0;
  espumaMetal.count = 0;
  espumaMate.instanceMatrix.needsUpdate = true;
  espumaMetal.instanceMatrix.needsUpdate = true;
  if (espumaMate.instanceColor) espumaMate.instanceColor.needsUpdate = true;
  if (espumaMetal.instanceColor) espumaMetal.instanceColor.needsUpdate = true;
}

// 16. BOTONES
btnModo.addEventListener('click', cambiarModo);
document.getElementById('btnBorrar').addEventListener('click', borrarTodo);

// 17. IMPORTAR Y QUITAR FONDO
const archivoFondo = document.getElementById('archivoFondo');
const btnFondoBlanco = document.getElementById('btnFondoBlanco');
let urlFondoActual = null;

archivoFondo.addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;

  const nuevaUrl = URL.createObjectURL(file);

  new THREE.TextureLoader().load(nuevaUrl, (texture) => {
    texture.colorSpace = THREE.SRGBColorSpace;
    if (scene.background && scene.background.isTexture) {
      scene.background.dispose();
    }
    if (urlFondoActual) URL.revokeObjectURL(urlFondoActual);
    urlFondoActual = nuevaUrl;
    scene.background = texture;
    btnFondoBlanco.style.display = '';
  }, undefined, () => {
    URL.revokeObjectURL(nuevaUrl);
    alert('No se pudo cargar la imagen.');
  });

  e.target.value = '';
});

btnFondoBlanco.addEventListener('click', () => {
  if (scene.background && scene.background.isTexture) {
    scene.background.dispose();
  }
  if (urlFondoActual) {
    URL.revokeObjectURL(urlFondoActual);
    urlFondoActual = null;
  }
  scene.background = new THREE.Color(0xffffff);
  btnFondoBlanco.style.display = 'none';
});

// 18. GUARDAR PNG
document.getElementById('btnGuardar').addEventListener('click', () => {
  renderer.render(scene, camera);

  renderer.domElement.toBlob((blob) => {
    if (!blob) {
      alert('No se pudo guardar la imagen.');
      return;
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');

    a.href = url;
    a.download = 'espuma-3d.png';

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }, 'image/png');
});

// 19. TECLADO
addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target.tagName !== 'BUTTON') {
    e.preventDefault();
    cambiarModo();
  }
});

// 20. ANIMACIÓN
function animar() {
  requestAnimationFrame(animar);
  controls.update();
  renderer.render(scene, camera);
}

animar();

// 21. REDIMENSIONAR
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
